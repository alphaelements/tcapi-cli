pre-commit:
  parallel: false
  commands:
    fmt:
      run: cargo fmt --all -- --check
    clippy:
      run: cargo clippy -- -D warnings
    test:
      run: cargo test
    license-check:
      glob: "{LICENSE,README.md,Cargo.toml,scripts/check_license.py,tests/test_check_license.py}"
      run: python3 scripts/check_license.py --policy apache-2.0 && python3 -m unittest tests/test_check_license.py
      fail_text: "License declarations are inconsistent with the Apache-2.0-only policy (ST-DCIT-018a)."
