[package]
name = "tachyon"
version = "0.1.0"
edition = "2021"
description = "CLI tool for Tachyon DIO (RP2350 high-speed digital I/O unit)"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
