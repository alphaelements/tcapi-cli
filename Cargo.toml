[package]
name = "pochi"
version = "0.1.0"
edition = "2021"
description = "CLI tool for Pochi-DIO (RP2350 high-speed digital I/O unit)"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
# Local development against the sibling pochi-tools checkout; the SDK owns
# the transport, the TOML schema and timestamp reconciliation.
pochi-sdk = { path = "../pochi-tools/sdk/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serialport = "4"
