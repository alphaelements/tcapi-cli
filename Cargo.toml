[package]
name = "tcapi"
version = "0.1.0"
edition = "2021"
description = "CLI tool for Tcapi-DIO (RP2350 high-speed digital I/O unit)"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
# Local development against the sibling tcapi-tools checkout; the SDK owns
# the transport, the TOML schema and timestamp reconciliation.
tcapi-sdk = { path = "../tcapi-tools/sdk/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serialport = "4"
