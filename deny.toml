# cargo-deny configuration (schema for cargo-deny >= 0.14, "version 2").
# Vulnerabilities, unmaintained crates, and unlicensed crates are denied
# by default in version 2 — no explicit keys needed.

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
# Third-party dependency licenses only. The crate itself is Apache-2.0 only
# (LICENSE); that is enforced by scripts/check_license.py.
# MPL-2.0 is allowed for `serialport` (direct, and via the tcapi-sdk path
# dependency) -- the same allowance as tcapi-tools/deny.toml.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "Unicode-3.0",
    "MPL-2.0",
]
